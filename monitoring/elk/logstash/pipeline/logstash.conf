input {
  tcp {
    port => 5000
    codec => json
  }

  http {
    port => 8080
    codec => json
  }

  beats {
    port => 5044
  }
}

filter {
  if [type] == "honeypot" {
    # Parse Cowrie JSON logs
    json {
      source => "message"
    }

    # Extract timestamp
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }

    # Categorize events
    if [eventid] == "cowrie.session.connect" {
      mutate {
        add_field => { "event_category" => "connection" }
      }
    } else if [eventid] =~ /cowrie.login/ {
      mutate {
        add_field => { "event_category" => "authentication" }
      }
    } else if [eventid] =~ /cowrie.command/ {
      mutate {
        add_field => { "event_category" => "command_execution" }
      }
    }

    # GeoIP enrichment
    if [src_ip] {
      geoip {
        source => "src_ip"
        target => "geoip"
      }
    }

    # Add tags for suspicious activity
    if [username] in ["root", "admin", "test"] {
      mutate {
        add_tag => ["suspicious_username"]
      }
    }

    if [password] and [password] != "" {
      mutate {
        add_tag => ["password_attempt"]
      }
    }
  }

  # Calculate anomaly scores (simple heuristics)
  ruby {
    code => '
      event.set("anomaly_score", 0)
      
      # Increase score for multiple failed logins
      if event.get("[eventid]") == "cowrie.login.failed"
        event.set("anomaly_score", event.get("anomaly_score") + 10)
      end
      
      # Increase score for command execution
      if event.get("[eventid]") =~ /cowrie.command/
        event.set("anomaly_score", event.get("anomaly_score") + 5)
      end
      
      # Increase score for file downloads
      if event.get("[eventid]") == "cowrie.session.file_download"
        event.set("anomaly_score", event.get("anomaly_score") + 20)
      end
    '
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "honeypot-logs-%{+YYYY.MM.dd}"
  }

  if [anomaly_score] and [anomaly_score] > 15 {
    http {
      url => "http://ai-api:8000/analyze"
      http_method => "post"
      format => "json"
      content_type => "application/json"
    }
  }

  stdout {
    codec => rubydebug
  }
}
