input {
  tcp {
    port => 5000
    codec => json
  }

  http {
    port => 8080
    codec => json
  }

  beats {
    port => 5044
  }
}

filter {
  if [type] == "honeypot" {
    # Parse Cowrie JSON logs
    json {
      source => "message"
    }

    # Extract timestamp
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }

    # Categorize events
    if [eventid] == "cowrie.session.connect" {
      mutate {
        add_field => { "event_category" => "connection" }
      }
    } else if [eventid] =~ /cowrie.login/ {
      mutate {
        add_field => { "event_category" => "authentication" }
      }
    } else if [eventid] =~ /cowrie.command/ {
      mutate {
        add_field => { "event_category" => "command_execution" }
      }
    }

    # CVE Detection - Extract CVE IDs from log fields
    ruby {
      code => '
        cve_pattern = /\bCVE-\d{4}-\d+\b/
        text_fields = ["message", "input", "command", "data", "payload"]
        cve_ids = []
        
        text_fields.each do |field|
          field_value = event.get(field)
          if field_value && field_value.is_a?(String)
            matches = field_value.scan(cve_pattern)
            cve_ids.concat(matches)
          end
        end
        
        if cve_ids.length > 0
          event.set("cve_detected", true)
          event.set("cve_ids", cve_ids.uniq)
          event.tag("cve_detected")
        end
      '
    }

    # GeoIP enrichment
    if [src_ip] {
      geoip {
        source => "src_ip"
        target => "geoip"
      }
    }

    # Add tags for suspicious activity
    if [username] in ["root", "admin", "test"] {
      mutate {
        add_tag => ["suspicious_username"]
      }
    }

    if [password] and [password] != "" {
      mutate {
        add_tag => ["password_attempt"]
      }
    }
  }

  # Calculate anomaly scores (simple heuristics)
  ruby {
    code => '
      event.set("anomaly_score", 0)
      
      # Increase score for multiple failed logins
      if event.get("[eventid]") == "cowrie.login.failed"
        event.set("anomaly_score", event.get("anomaly_score") + 10)
      end
      
      # Increase score for command execution
      if event.get("[eventid]") =~ /cowrie.command/
        event.set("anomaly_score", event.get("anomaly_score") + 5)
      end
      
      # Increase score for file downloads
      if event.get("[eventid]") == "cowrie.session.file_download"
        event.set("anomaly_score", event.get("anomaly_score") + 20)
      end
      
      # Increase score significantly for CVE detection
      if event.get("cve_detected")
        event.set("anomaly_score", event.get("anomaly_score") + 30)
      end
    '
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "honeypot-logs-%{+YYYY.MM.dd}"
  }

  # Forward CVE-detected logs to AI API for enrichment
  if "cve_detected" in [tags] {
    http {
      url => "http://ai-api:8000/cve/enrich"
      http_method => "post"
      format => "json"
      content_type => "application/json"
      mapping => {
        "log_entry" => "%{message}"
      }
    }
  }

  if [anomaly_score] and [anomaly_score] > 15 {
    http {
      url => "http://orchestration-api:3000/events"
      http_method => "post"
      format => "json"
      content_type => "application/json"
      mapping => {
        "type" => "anomaly_detected"
        "source" => "logstash"
        "data" => {
          "anomaly_score" => "%{anomaly_score}"
          "event_id" => "%{eventid}"
          "cve_detected" => "%{cve_detected}"
          "cve_ids" => "%{cve_ids}"
        }
      }
    }
  }

  stdout {
    codec => rubydebug
  }
}
