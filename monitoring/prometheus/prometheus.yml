global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'project-asylum'
    environment: 'dev'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'honeypot-cowrie'
    static_configs:
      - targets: ['cowrie:9000']

  - job_name: 'ai-api'
    static_configs:
      - targets: ['ai-api:8000']
    metrics_path: '/metrics'

  - job_name: 'orchestration-api'
    static_configs:
      - targets: ['orchestration-api:3000']
    metrics_path: '/metrics'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules/*.yml'
