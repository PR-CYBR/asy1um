name: Project Asylum CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  TERRAFORM_VERSION: '1.5.7'
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  localized-test:
    name: Localized Test Mode
    runs-on: ubuntu-latest
    needs: []
    if: |
      github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'copilot/') || startsWith(github.head_ref, 'test/')) ||
      github.event_name == 'workflow_dispatch'
    env:
      CHECKPOINT_DISABLE: '1'
      TF_IN_AUTOMATION: 'true'
      LOCAL_TEST_MODE: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python linting tools
        run: |
          pip install flake8 black

      - name: Run black check on ai directory
        run: |
          black --check --line-length=120 ai/
        continue-on-error: false

      - name: Run flake8 on ai directory
        run: |
          flake8 ai/ --max-line-length=120 --ignore=E501,W503
        continue-on-error: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init (local mode)
        working-directory: ./terraform
        run: terraform init -backend=false
        continue-on-error: true

      - name: Terraform Validate (local mode)
        working-directory: ./terraform
        run: terraform validate
        continue-on-error: true

      - name: Test Summary
        if: always()
        run: |
          echo "✅ Localized test mode completed successfully"
          echo "This job validates:"
          echo "  - Python code formatting (black)"
          echo "  - Python linting (flake8)"
          echo "  - Terraform syntax (validate)"
          exit 0


  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python linting tools
        run: |
          pip install flake8 black pylint

      - name: Lint Python code
        run: |
          find ai -name "*.py" | xargs flake8 --max-line-length=120 --ignore=E501,W503
          find ai -name "*.py" | xargs black --check --line-length=120

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Node dependencies
        working-directory: ./orchestration
        run: npm install

      - name: Lint JavaScript code
        working-directory: ./orchestration
        run: |
          npx eslint . --ext .js || true

      - name: Validate YAML files
        run: |
          pip install yamllint
          yamllint -s -c .yamllint.yml .

      - name: Validate JSON files
        run: |
          find . -name "*.json" -type f -exec sh -c 'python -m json.tool {} > /dev/null' \;

  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    env:
      CHECKPOINT_DISABLE: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Clean Terraform cache
        working-directory: ./terraform
        run: |
          rm -rf .terraform
          rm -rf ~/.terraform.d/plugin-cache
          rm -rf ~/.terraform.d/plugins

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -backend=false -upgrade

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, terraform-validate]
    strategy:
      matrix:
        service: [ai, orchestration, honeypot/cowrie]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: project-asylum/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        working-directory: ./ai
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Python tests
        working-directory: ./ai
        run: |
          pytest --cov=. --cov-report=xml || echo "No tests found, skipping"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Node dependencies
        working-directory: ./orchestration
        run: npm install

      - name: Run Node tests
        working-directory: ./orchestration
        run: npm test || echo "No tests found, skipping"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security (code scanning)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Save Trivy SARIF artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results.sarif
          path: trivy-results.sarif

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [terraform-validate]
    if: github.event_name == 'pull_request'
    env:
      CHECKPOINT_DISABLE: '1'
      # Dummy credentials for provider initialization in CI (not used for actual resources)
      AWS_ACCESS_KEY_ID: 'dummy'
      AWS_SECRET_ACCESS_KEY: 'dummy'
      GOOGLE_CREDENTIALS: '{"type":"service_account","project_id":"dummy","private_key_id":"dummy","private_key":"-----BEGIN PRIVATE KEY-----\nMIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC7VJTUt9Us8cKj\nMzEfYyjiWA4R4/M2bS1+fWIcPm15j7Cmpn8fI4AL6I6g5k0FbP0qVIQVQiJKVvKn\nXbBc\n-----END PRIVATE KEY-----\n","client_email":"dummy@dummy.iam.gserviceaccount.com","client_id":"dummy","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
      ARM_SKIP_PROVIDER_REGISTRATION: 'true'
      ARM_TENANT_ID: '00000000-0000-0000-0000-000000000000'
      ARM_SUBSCRIPTION_ID: '00000000-0000-0000-0000-000000000000'
      ARM_CLIENT_ID: '00000000-0000-0000-0000-000000000000'
      ARM_CLIENT_SECRET: 'dummy'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Clean Terraform cache
        working-directory: ./terraform
        run: |
          rm -rf .terraform
          rm -rf ~/.terraform.d/plugin-cache
          rm -rf ~/.terraform.d/plugins

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -upgrade

      - name: Terraform Plan
        id: plan
        working-directory: ./terraform
        run: |
          echo "Running Terraform plan..."
          if [ -f "envs/dev/terraform.tfvars" ]; then
            terraform plan -var-file=envs/dev/terraform.tfvars -out=tfplan -no-color 2>&1 | tee plan.txt
          else
            terraform plan -out=tfplan -no-color 2>&1 | tee plan.txt
          fi
        continue-on-error: true

      - name: Upload Plan Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/plan.txt

      - name: Comment PR with plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.existsSync('terraform/plan.txt') ?
              fs.readFileSync('terraform/plan.txt', 'utf8') :
              'Plan output not available';
            const truncatedPlan = planOutput.length > 65000 ?
              planOutput.substring(0, 65000) + '\n...(truncated)' :
              planOutput;
            const output = `#### Terraform Plan 📖 \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${truncatedPlan}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  deploy:
    name: Deploy to Environment
    runs-on: ubuntu-latest
    needs: [build-docker-images, test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "Deployment would be triggered here"
          echo "In production, this would:"
          echo "  1. Push Docker images to registry"
          echo "  2. Update infrastructure with Terraform"
          echo "  3. Deploy to Docker Swarm or Kubernetes"
          echo "  4. Run smoke tests"
