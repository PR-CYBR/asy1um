# GitHub Actions Workflow - Optimized CI/CD Pipeline
#
# This workflow implements several optimizations to reduce runtime costs
# and improve Docker build performance:
#
# 1. Concurrency Control: Prevents overlapping builds on the same branch,
#    canceling in-progress builds when new commits are pushed.
#
# 2. Pip Caching: Caches Python packages across builds to avoid redundant
#    downloads and compilations.
#
# 3. Docker Layer Caching: Uses GitHub Actions cache to store and reuse
#    Docker build layers across workflow runs.
#
# 4. Base Image Strategy: Heavy ML dependencies (TensorFlow, PyTorch, CUDA)
#    are pre-built in a base image that's only rebuilt when dependencies change.
#    This reduces typical build time from 15-20 minutes to under 2 minutes.
#
# 5. Conditional Base Image Builds: The base image is only rebuilt when
#    requirements.txt changes, saving significant CI/CD resources.
#
# Maintenance Notes:
# - The base image should be rebuilt manually or automatically when major
#   dependency versions change.
# - Monitor cache hit rates in the Actions logs to ensure caching is effective.
# - Adjust cache key patterns if dependency files are reorganized.

name: Build and Push Docker Images

# Trigger the workflow on push to main and pull requests
on:
  push:
    branches:
      - main
      - develop
      - 'copilot/**'
  pull_request:
    branches:
      - main
      - develop
  # Allow manual workflow runs
  workflow_dispatch:

# Concurrency control: Only one workflow per branch/PR
# Cancels in-progress builds when new commits are pushed
# This prevents wasted resources on outdated builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Detect changes to requirements.txt
  # Uses PR-friendly path filtering to determine if base image needs rebuild
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_changed: ${{ steps.filter.outputs.base }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            base:
              - '**/requirements.txt'

  # Job 2: Build Base ML Image
  # This job builds the base image containing heavy ML dependencies.
  # It only runs when requirements.txt changes or when manually triggered.
  build-base-ml:
    name: Build Base ML Image
    needs: [detect-changes]
    if: needs.detect-changes.outputs.base_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up QEMU for multi-platform builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Docker Buildx for advanced build features
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cache pip packages to speed up base image builds
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      # Build and push the base image with layer caching
      - name: Build & push Base ML image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          tags: ghcr.io/folkvarlabs/project-asylum:base-ml
          cache-from: type=gha,scope=base-ml
          cache-to: type=gha,mode=max,scope=base-ml

      - name: Base Image Build Summary
        run: |
          echo "::notice::Base ML image built and pushed successfully"
          echo "::notice::This image contains TensorFlow, PyTorch, and other heavy ML dependencies"

  # Job 3: Build AI Application Image
  # This job builds the main application image using the pre-built base.
  # It includes a fallback to build the base image if it doesn't exist.
  build-ai-image:
    name: Build Docker Images (ai)
    runs-on: ubuntu-latest
    needs: [detect-changes, build-base-ml]
    if: always()
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Docker Buildx for advanced build features
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Ensure base image exists - build it if missing
      - name: Ensure base image exists
        id: ensure-base
        shell: bash
        run: |
          set -e
          if docker buildx imagetools inspect ghcr.io/folkvarlabs/project-asylum:base-ml >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Base image missing; building and pushing ghcr.io/folkvarlabs/project-asylum:base-ml"
            docker buildx build \
              --file Dockerfile.base \
              --tag ghcr.io/folkvarlabs/project-asylum:base-ml \
              --push \
              --cache-from type=gha,scope=base-ml \
              --cache-to type=gha,mode=max,scope=base-ml \
              .
          fi

      # Extract metadata for Docker image tagging
      - name: Extract metadata (optional labels)
        id: meta-ai
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/folkvarlabs/project-asylum
          tags: |
            type=raw,value=ai
            type=sha,format=short,prefix=ai-

      # Build and push the AI application image
      - name: Build & push AI image
        id: build-ai
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/folkvarlabs/project-asylum:ai
            ghcr.io/folkvarlabs/project-asylum:ai-${{ github.sha }}
          labels: ${{ steps.meta-ai.outputs.labels }}
          cache-from: type=gha,scope=ai-app
          cache-to: type=gha,mode=max,scope=ai-app
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      # Display the image digest
      - name: Show pushed image digest
        run: echo "AI image digest - ${{ steps.build-ai.outputs.digest }}"

      - name: AI Image Build Summary
        run: |
          echo "::notice::AI application image built and pushed successfully"
          echo "::notice::Base image: ghcr.io/folkvarlabs/project-asylum:base-ml"

  # Job 4: Security Scanning
  # Scans the built images for vulnerabilities
  # Only runs after successful AI image build
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-ai-image]
    if: needs.build-ai-image.result == 'success'
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      # Log in to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Run Trivy security scanner
      - name: Trivy scan (image)
        id: trivy
        uses: aquasecurity/trivy-action@0.18.0
        with:
          image-ref: ghcr.io/folkvarlabs/project-asylum:ai
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: 'os,library'

      # Check if SARIF file exists before uploading
      - name: Check SARIF exists
        id: check-sarif
        run: |
          if [ -f trivy-results.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Upload results to GitHub Security tab only if file exists
      - name: Upload SARIF
        if: steps.check-sarif.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Security Scan Summary
        run: |
          echo "::notice::Security scan completed"
          echo "::notice::Review results in the Security tab"
