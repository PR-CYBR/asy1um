[honeypot]
hostname = server-01
log_path = /cowrie/cowrie-git/var/log/cowrie
download_path = /cowrie/cowrie-git/var/downloads
data_path = /cowrie/cowrie-git/var/data
state_path = /cowrie/cowrie-git/var/state
tty_log_path = /cowrie/cowrie-git/var/tty
contents_path = /cowrie/cowrie-git/honeyfs
share_path = /cowrie/cowrie-git/share
txtcmds_path = /cowrie/cowrie-git/txtcmds
timezone = UTC
listen_endpoints = tcp:2222:interface=0.0.0.0

[ssh]
enabled = true
version = SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.5
forwarding = true
forward_redirect = false

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
logfile = /cowrie/cowrie-git/var/log/cowrie/cowrie.json

[output_elasticsearch]
enabled = true
host = elasticsearch
port = 9200
index = honeypot-logs
type = _doc

[output_logstash]
enabled = true
host = logstash
port = 5000

[output_virustotal]
enabled = false

[output_splunk]
enabled = false

[output_hpfeeds]
enabled = false

# Filesystem simulation
[fs]
arch = linux-x64-lsb

# User database
[backend]
auth_class = UserDB
